<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPF Driver Safety Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1B2A4A;
    --orange: #D45F1E;
    --orange-light: #F07A3A;
    --bg: #0f1a2e;
    --surface: rgba(255,255,255,0.05);
    --surface2: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --text2: rgba(255,255,255,0.6);
    --text3: rgba(255,255,255,0.35);
    --gold: #F5C842;
    --silver: #C0C8D8;
    --bronze: #CD7F32;
    --green: #4ADE80;
    --rad: 12px;
    --rad-sm: 8px;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(27,42,74,0.8) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(212,95,30,0.15) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-mark { width: 44px; height: 44px; background: var(--orange); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-mark svg { width: 24px; height: 24px; fill: #fff; }
  .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .logo-sub { font-size: 13px; color: var(--text2); margin-top: 1px; }
  .header-right { text-align: right; }
  .period-badge { display: inline-block; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
  .updated-text { font-size: 11px; color: var(--text3); margin-top: 5px; font-family: 'DM Mono', monospace; }

  /* Loading */
  #loading { text-align: center; padding: 6rem 2rem; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text2); font-size: 15px; }
  #loading-detail { font-size: 12px; color: var(--text3); margin-top: 8px; font-family: 'DM Mono', monospace; }

  /* Login */


  /* Dashboard */
  #dashboard { display: none; }

  /* Groups grid */
  .groups-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
  @media (max-width: 900px) { .groups-grid { grid-template-columns: 1fr; } }

  .group-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--rad); overflow: hidden; }
  .group-header { background: var(--navy); padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .group-name { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .group-meta { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; }
  .group-accent { width: 4px; height: 28px; border-radius: 2px; flex-shrink: 0; }

  /* Driver rows */
  .driver-list { padding: 0.5rem 0; }
  .driver-row { display: flex; align-items: center; gap: 12px; padding: 0.65rem 1.25rem; transition: background 0.12s; }
  .driver-row:hover { background: var(--surface2); }
  .rank { font-size: 13px; font-weight: 700; font-family: 'DM Mono', monospace; width: 24px; flex-shrink: 0; text-align: center; }
  .rank-1 { color: var(--gold); font-size: 15px; }
  .rank-2 { color: var(--silver); }
  .rank-3 { color: var(--bronze); }
  .rank-other { color: var(--text3); }
  .medal { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
  .driver-name { flex: 1; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .driver-name.top3 { font-weight: 600; }
  .score-area { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .score-bar-track { width: 80px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 2px; }
  .score-val { font-size: 13px; font-weight: 600; font-family: 'DM Mono', monospace; min-width: 36px; text-align: right; }
  .events-pill { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; min-width: 52px; text-align: right; }
  .perfect-badge { font-size: 10px; background: rgba(74,222,128,0.15); color: var(--green); border-radius: 4px; padding: 2px 6px; font-weight: 600; }

  /* Divider */
  .driver-divider { height: 0.5px; background: var(--border); margin: 0 1.25rem; }

  /* Footer */
  footer { margin-top: 2rem; text-align: center; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }

  /* Scrolling if needed for OptiSigns */
  .group-card.tall .driver-list { max-height: none; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; margin: -0.75rem 0 1.5rem; }
  .tab { background: var(--surface); border: 0.5px solid var(--border); color: var(--text2); font: 600 13px 'DM Sans', sans-serif; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
  .tab:hover { background: var(--surface2); color: var(--text); }
  .tab.active { background: var(--orange); border-color: var(--orange); color: #fff; }

  /* DOT Inspections */
  #dot-view { display: none; }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--rad); padding: 1rem 1.25rem; }
  .kpi-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; }
  .kpi-val { font-size: 28px; font-weight: 700; margin-top: 6px; font-family: 'DM Mono', monospace; letter-spacing: -0.02em; }
  .kpi-sub { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: 'DM Mono', monospace; }
  .range-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; gap: 1rem; flex-wrap: wrap; }
  .range-btns { display: flex; gap: 4px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; padding: 3px; }
  .range-btn { background: none; border: 0; color: var(--text2); font: 500 12px 'DM Mono', monospace; padding: 5px 12px; border-radius: 16px; cursor: pointer; }
  .range-btn.active { background: var(--surface2); color: var(--text); }
  .search { background: var(--surface); border: 0.5px solid var(--border); border-radius: 20px; color: var(--text); font: 13px 'DM Sans', sans-serif; padding: 7px 14px; width: 220px; }
  .search::placeholder { color: var(--text3); }
  .dot-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; align-items: start; }
  @media (max-width: 1100px) { .dot-grid { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--rad); overflow: hidden; margin-bottom: 1.5rem; }
  .panel-head { background: var(--navy); padding: 0.85rem 1.25rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .panel-title { font-size: 15px; font-weight: 700; }
  .panel-meta { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; }
  .tbl-wrap { overflow-x: auto; }
  table.dt { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dt th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 12px; border-bottom: 0.5px solid var(--border); cursor: pointer; white-space: nowrap; user-select: none; }
  .dt th.num, .dt td.num { text-align: right; }
  .dt th.sorted { color: var(--orange-light); }
  .dt td { padding: 9px 12px; border-bottom: 0.5px solid var(--border); white-space: nowrap; }
  .dt tr.drow { cursor: pointer; }
  .dt tr.drow:hover td { background: var(--surface2); }
  .dt td.mono { font-family: 'DM Mono', monospace; }
  .div-tag { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }
  .pill { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; font-family: 'DM Mono', monospace; }
  .pill.clean { background: rgba(74,222,128,0.15); color: var(--green); }
  .pill.oos { background: rgba(248,113,113,0.18); color: #f87171; }
  .pill.viol { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .detail-row td { background: rgba(0,0,0,0.18); white-space: normal; padding: 10px 16px 14px; }
  .insp { padding: 8px 0; border-bottom: 0.5px dashed var(--border); }
  .insp:last-child { border-bottom: 0; }
  .insp-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
  .vio { font-size: 12px; color: var(--text2); margin: 4px 0 0 14px; }
  .vio b { color: var(--text); font-weight: 600; font-family: 'DM Mono', monospace; }
  .bar-row { display: grid; grid-template-columns: 1fr 120px 28px; align-items: center; gap: 10px; padding: 8px 1.25rem; font-size: 13px; }
  .bar-track { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--orange); border-radius: 3px; }
  .bar-n { font-family: 'DM Mono', monospace; text-align: right; color: var(--text2); }
  .recent { padding: 10px 1.25rem; border-bottom: 0.5px solid var(--border); }
  .recent:last-child { border-bottom: 0; }
  .recent-name { font-size: 13px; font-weight: 600; }
  .recent-meta { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; margin-top: 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .empty { padding: 1.5rem; text-align: center; color: var(--text3); font-size: 13px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo-area">
      <div class="logo-mark"><svg viewBox="0 0 16 16"><path d="M8 1L2 4v4c0 3.3 2.5 6.4 6 7 3.5-.6 6-3.7 6-7V4L8 1z"/></svg></div>
      <div>
        <div class="logo-text">Texas Pride Fuels</div>
        <div class="logo-sub" id="logo-sub">Driver Safety Leaderboard · Last 90 Days</div>
      </div>
    </div>
    <div class="header-right">
      <div class="period-badge" id="period-badge">Loading…</div>
      <div class="updated-text" id="updated-text"></div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="lytx">Lytx Leaderboard</button>
    <button class="tab" data-view="dot">DOT Inspections</button>
    <button class="tab" data-view="bol">Unit Loads</button>
  </nav>

  <div id="bol-view" style="display:none;">
    <div class="kpis" id="bol-kpis"></div>
    <div class="range-row">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <div class="range-btns" id="bol-range">
          <button class="range-btn" data-days="7">7D</button>
          <button class="range-btn active" data-days="30">30D</button>
          <button class="range-btn" data-days="90">90D</button>
          <button class="range-btn" data-days="365">12M</button>
        </div>
        <select class="search" id="bol-terminal" style="width:auto;display:none;"></select>
      </div>
      <input class="search" id="bol-search" placeholder="Search unit or driver…">
    </div>
    <div class="dot-grid">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Loads by Unit</div><div class="panel-meta" id="bol-unit-meta"></div></div>
        <div class="tbl-wrap"><table class="dt" id="bol-units"></table></div>
      </div>
      <div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Loads by Driver</div><div class="panel-meta" id="bol-driver-meta"></div></div>
          <div class="tbl-wrap"><table class="dt" id="bol-drivers"></table></div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Latest Day</div><div class="panel-meta" id="bol-latest-meta"></div></div>
          <div id="bol-latest"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="dot-view">
    <div class="kpis" id="dot-kpis"></div>
    <div class="range-row">
      <div class="range-btns" id="dot-range">
        <button class="range-btn" data-days="90">90D</button>
        <button class="range-btn" data-days="365">12M</button>
        <button class="range-btn active" data-days="730">24M</button>
      </div>
      <input class="search" id="dot-search" placeholder="Search driver…">
    </div>
    <div class="dot-grid">
      <div class="panel">
        <div class="panel-head"><div class="panel-title">Inspections by Driver</div><div class="panel-meta" id="dot-driver-meta"></div></div>
        <div class="tbl-wrap"><table class="dt" id="dot-table"></table></div>
      </div>
      <div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Violations by BASIC</div><div class="panel-meta" id="dot-basic-meta"></div></div>
          <div id="dot-basics"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><div class="panel-title">Recent Inspections</div><div class="panel-meta">Last 8</div></div>
          <div id="dot-recent"></div>
        </div>
      </div>
    </div>
  </div>


  <div id="loading" style="display:none;">
    <div class="spinner"></div>
    <p>Building leaderboard…</p>
    <div id="loading-detail"></div>
  </div>

  <div id="dashboard">
    <div class="groups-grid" id="groups-grid"></div>
  </div>

  <footer id="footer" style="display:none;">
    Refreshes daily at 5:00 AM CT &nbsp;·&nbsp; Powered by Lytx &nbsp;·&nbsp; Texas Pride Fuels
  </footer>
</div>

<script>
const PROXY = 'https://lytx-proxy.k-hyche.workers.dev';

const GROUPS = {
  '5100ffff-60b6-e4cd-8fba-60a3e15b0000': 'Lube',
  '5100ffff-60b6-e4cd-8fb9-60a3e15b0000': 'AFS',
  '5100ffff-60b6-e4cd-c031-60a3e15b0000': 'Transport',
  '5100ffff-60b6-e5cd-5b73-60a3e15b0000': 'Route',
  '5100ffff-60b6-e5cd-8f82-60a3e15b0000': 'Transport',
};

const GROUP_COLORS = {
  'Lube':      '#D45F1E',
  'AFS':       '#1a5fa8',
  'Transport': '#0f6e56',
  'Route':     '#7f77dd',
};

const GROUP_ORDER = ['Transport', 'Lube', 'AFS', 'Route'];

let token = null;
let refreshTimer = null;

async function autoLogin() {
  try {
    const resp = await fetch(PROXY + '/token');
    if (!resp.ok) throw new Error('Token fetch failed');
    const data = await resp.json();
    token = data.access_token || data.token || data.authToken;
    if (!token) throw new Error('No token in response');
    return true;
  } catch(e) {
    document.getElementById('loading-detail').textContent = 'Auth error: ' + e.message;
    return false;
  }
}

function isValidDriver(e) {
  const first = (e.driverFirstName || '').trim().toLowerCase();
  const last  = (e.driverLastName  || '').trim().toLowerCase();
  const full  = (first + ' ' + last).trim();
  if (!full) return false;
  if (full.includes('unknown')) return false;
  if (['mechanic','driver','vendor','contractor','lead'].includes(first)) return false;
  return true;
}

async function refreshToken() {
  return await autoLogin();
}

// Auto-start on page load
window.addEventListener('DOMContentLoaded', async () => {
  initTabs();
  loadDot(); // independent of Lytx auth
  loadBol();
  const ok = await autoLogin();
  if (ok) await loadLeaderboard();
  scheduleRefresh();
});

function scheduleRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  const msUntil5amCT = getMsUntil5amCT();
  console.log('Next refresh in', Math.round(msUntil5amCT/1000/60), 'minutes');
  refreshTimer = setTimeout(async () => {
    const ok = await refreshToken();
    if (ok) await loadLeaderboard();
    await loadDot();
    await loadBol();
    scheduleRefresh();
  }, msUntil5amCT);
}

/* =========================================================
   Tabs  (URL options: ?view=dot  ·  ?rotate=60  → auto-switch every 60s for TV)
   ========================================================= */
let currentView = 'lytx';
let lytxReady = false;
const VIEWS = ['lytx', 'dot', 'bol'];
const headerText = { lytx: { badge: 'Loading…', updated: '' }, dot: { badge: 'Loading…', updated: '' }, bol: { badge: 'Loading…', updated: '' } };
const SUBTITLES = { lytx: 'Driver Safety Leaderboard · Last 90 Days', dot: 'DOT Roadside Inspections · Per Driver', bol: 'Terminal Loads · By Unit & Driver' };
const FOOTERS = {
  lytx: 'Refreshes daily at 5:00 AM CT &nbsp;·&nbsp; Powered by Lytx &nbsp;·&nbsp; Texas Pride Fuels',
  dot:  'Refreshes daily at 6:00 AM CT &nbsp;·&nbsp; Source: CAB / FMCSA &nbsp;·&nbsp; Texas Pride Fuels',
  bol:  'Refreshes daily at 7:00 AM CT &nbsp;·&nbsp; Source: Terminal EOD BOL Reports &nbsp;·&nbsp; Texas Pride Fuels',
};

function initTabs() {
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));
  const p = new URLSearchParams(location.search);
  if (VIEWS.includes(p.get('view'))) setView(p.get('view'));
  const rot = parseInt(p.get('rotate'), 10);
  if (rot > 0) setInterval(() => setView(VIEWS[(VIEWS.indexOf(currentView) + 1) % VIEWS.length]), rot * 1000);
}

function setView(v) {
  currentView = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  const isLytx = v === 'lytx';
  document.getElementById('loading').style.display   = isLytx && !lytxReady ? 'block' : 'none';
  document.getElementById('dashboard').style.display = isLytx && lytxReady ? 'block' : 'none';
  document.getElementById('dot-view').style.display  = v === 'dot' ? 'block' : 'none';
  document.getElementById('bol-view').style.display  = v === 'bol' ? 'block' : 'none';
  const showFooter = isLytx ? lytxReady : v === 'dot' ? !!dotData : !!bolData;
  const footer = document.getElementById('footer');
  footer.innerHTML = FOOTERS[v];
  footer.style.display = showFooter ? 'block' : 'none';
  document.getElementById('logo-sub').textContent = SUBTITLES[v];
  applyHeader();
}

function applyHeader() {
  document.getElementById('period-badge').textContent = headerText[currentView].badge;
  document.getElementById('updated-text').textContent = headerText[currentView].updated;
}

/* =========================================================
   DOT Inspections (CAB → Cloudflare Worker → here)
   ========================================================= */
const CAB_API = 'https://tpf-cab-inspections.k-hyche.workers.dev';
let dotData = null;
let dotDays = 730;
let dotSort = { key: 'last', dir: -1 };
let dotOpen = null;
const lytxDriverGroup = {}; // nameKey -> Lytx division

function nameKey(first, last) {
  const f = (first || '').trim().split(/\s+/)[0].toLowerCase();
  const l = (last || '').trim().toLowerCase();
  return f + '|' + l;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function titleCase(s) { return (s || '').toLowerCase().replace(/(^|[\s'-])\w/g, m => m.toUpperCase()); }
function fmtDate(d) { return d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}) : '—'; }

async function loadDot() {
  try {
    const r = await fetch(CAB_API + '/inspections');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    dotData = await r.json();
    // "Clean" = no CSA severity points and no out-of-service (non-BASIC items like registration don't count)
    for (const i of dotData.inspections) {
      i.points = i.violations.reduce((s, v) => s + (v.weight || 0), 0);
      i.zeroViol = i.violations.length === 0;
      i.clean = !i.oos && i.points === 0;
    }
    const upd = new Date(dotData.updatedAt);
    headerText.dot.updated = 'CAB synced ' + upd.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + upd.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    if (!loadDot.wired) wireDotControls();
    renderDot();
    if (currentView === 'dot') setView('dot');
  } catch (e) {
    headerText.dot = { badge: 'Unavailable', updated: 'CAB feed error: ' + e.message };
    document.getElementById('dot-kpis').innerHTML = '';
    document.getElementById('dot-table').innerHTML = `<tr><td class="empty">Could not load inspection data (${esc(e.message)}).</td></tr>`;
    if (currentView === 'dot') applyHeader();
  }
}

function wireDotControls() {
  loadDot.wired = true;
  document.querySelectorAll('#dot-range .range-btn').forEach(b => b.addEventListener('click', () => {
    dotDays = +b.dataset.days; dotOpen = null;
    document.querySelectorAll('#dot-range .range-btn').forEach(x => x.classList.toggle('active', x === b));
    renderDot();
  }));
  document.getElementById('dot-search').addEventListener('input', () => renderDriverTable());
}

function dotInspectionsInRange() {
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - dotDays);
  const c = cutoff.toISOString().slice(0, 10);
  return (dotData?.inspections || []).filter(i => i.date >= c);
}

function buildDrivers(insps) {
  const map = {};
  for (const i of insps) {
    for (const d of (i.drivers || [])) {
      const key = d.licHash || nameKey(d.first, d.last);
      const m = map[key] ||= {
        key, name: titleCase(`${(d.first||'').split(' ')[0]} ${d.last||''}`).trim(),
        division: lytxDriverGroup[nameKey(d.first, d.last)] || '—',
        insp: 0, clean: 0, viol: 0, oos: 0, last: '', list: [],
      };
      m.insp++; if (i.clean) m.clean++; m.viol += i.violations.length; if (i.oos) m.oos++;
      if (i.date > m.last) m.last = i.date;
      m.list.push(i);
    }
  }
  return Object.values(map).map(m => ({ ...m, cleanPct: m.insp ? m.clean / m.insp : 0 }));
}

let dotDriversCache = [];

function renderDot() {
  if (!dotData) return;
  const insps = dotInspectionsInRange();
  const n = insps.length;
  const clean = insps.filter(i => i.clean).length;
  const oos = insps.filter(i => i.oos).length;
  const viol = insps.reduce((s, i) => s + i.violations.length, 0);
  const last = insps.map(i => i.date).sort().at(-1);
  const daysSince = last ? Math.max(0, Math.round((new Date(new Date().toDateString()) - new Date(last + 'T00:00:00')) / 86400000)) : null;
  const pct = x => n ? Math.round(x / n * 100) + '%' : '—';
  const label = { 90: 'Last 90 days', 365: 'Last 12 months', 730: 'Last 24 months' }[dotDays];

  headerText.dot.badge = label;
  if (currentView === 'dot') applyHeader();

  document.getElementById('dot-kpis').innerHTML = [
    ['Inspections', n, `${new Set(insps.flatMap(i => i.drivers.map(d => d.licHash))).size} drivers`, '#fff'],
    ['Clean Rate', pct(clean), `${clean} with no CSA points · ${insps.filter(i => i.zeroViol).length} zero-violation`, '#4ADE80'],
    ['Out of Service', pct(oos), `${oos} inspection${oos !== 1 ? 's' : ''}`, oos ? '#f87171' : '#4ADE80'],
    ['Violations', viol, n ? (viol / n).toFixed(1) + ' per inspection' : '', '#fbbf24'],
    ['Last Inspection', daysSince === null ? '—' : daysSince + 'd', last ? fmtDate(last) : '', '#fff'],
  ].map(([l, v, s, c]) => `<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-val" style="color:${c}">${v}</div><div class="kpi-sub">${s}</div></div>`).join('');

  dotDriversCache = buildDrivers(insps);
  renderDriverTable();

  // BASIC breakdown
  const basics = {};
  insps.forEach(i => i.violations.forEach(v => { const k = v.basic || 'Non-CSA'; basics[k] = (basics[k] || 0) + 1; }));
  const bl = Object.entries(basics).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...bl.map(b => b[1]));
  document.getElementById('dot-basic-meta').textContent = `${viol} total`;
  document.getElementById('dot-basics').innerHTML = bl.length
    ? bl.map(([k, c]) => `<div class="bar-row"><div>${esc(k)}</div><div class="bar-track"><div class="bar-fill" style="width:${c / max * 100}%"></div></div><div class="bar-n">${c}</div></div>`).join('')
    : '<div class="empty">No violations in this period</div>';

  // Recent
  const recent = [...insps].sort((a, b) => (b.start || b.date).localeCompare(a.start || a.date)).slice(0, 8);
  document.getElementById('dot-recent').innerHTML = recent.length ? recent.map(i => {
    const who = i.drivers.map(d => titleCase(`${(d.first||'').split(' ')[0]} ${d.last||''}`)).join(', ') || 'Unknown driver';
    return `<div class="recent"><div class="recent-name">${esc(who)}</div>
      <div class="recent-meta">${fmtDate(i.date)} · L${i.level} · ${esc(i.state)} ${statusPill(i)}</div></div>`;
  }).join('') : '<div class="empty">No inspections in this period</div>';
}

function statusPill(i) {
  if (i.oos) return '<span class="pill oos">OOS</span>';
  if (i.zeroViol) return '<span class="pill clean">CLEAN</span>';
  if (i.clean) return '<span class="pill clean">CLEAN · NO CSA PTS</span>';
  return `<span class="pill viol">${i.violations.length} VIOL · ${i.points} PTS</span>`;
}

      <td class="num mono" style="color:${d.oos ? '#f87171' : 'var(--text3)'}">${d.oos}</td>
      <td class="num mono">${fmtDate(d.last)}</td></tr>`;
    if (dotOpen === d.key) {
      const list = [...d.list].sort((a, b) => b.date.localeCompare(a.date)).map(i => {

          `<div class="vio"><b>${esc(v.code)}</b> ${esc(v.desc)} <span style="color:var(--text3)">· ${v.basic ? esc(v.basic) + ' · wt ' + (v.weight ?? 0) : 'Non-CSA'}${v.oos ? ' · <span style="color:#f87171">OOS</span>' : ''}</span></div>`).join('');

      }).join('');
      html += `<tr class="detail-row"><td colspan="${DOT_COLS.length}">${list}</td></tr>`;

  }).join('');

  const t = document.getElementById('dot-table');
  t.innerHTML = head + (body || `<tr><td colspan="${DOT_COLS.length}" class="empty">No drivers match</td></tr>`);
  t.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.k;
    dotSort = dotSort.key === k ? { key: k, dir: -dotSort.dir } : { key: k, dir: (k === 'name' || k === 'division') ? 1 : -1 };
    renderDriverTable();
  }));
  t.querySelectorAll('tr.drow').forEach(tr => tr.addEventListener('click', () => {
    dotOpen = dotOpen === tr.dataset.key ? null : tr.dataset.key;
    renderDriverTable();
  }));
}

function getMsUntil5amCT() {
  const now = new Date();
  // CT is UTC-5 (CST) or UTC-6 (CDT) - use UTC-5 (CST)
  const utcOffset = -5 * 60;
  const ctNow = new Date(now.getTime() + utcOffset * 60000);
  const next5am = new Date(ctNow);
  next5am.setHours(5, 0, 0, 0);
  if (next5am <= ctNow) next5am.setDate(next5am.getDate() + 1);
  return next5am - ctNow;
}

async function loadLeaderboard() {
  lytxReady = false;
  if (currentView === 'lytx') document.getElementById('loading').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('footer').style.display = 'none';

  // Align to CT midnight (UTC-5) so display and API window match exactly
  const now = new Date();
  const ctOffset = 5 * 60 * 60 * 1000; // CST UTC-5
  const todayCtMidnight = new Date(Math.floor((now.getTime() - ctOffset) / 86400000) * 86400000 + ctOffset);
  const end   = todayCtMidnight;
  const start = new Date(todayCtMidnight.getTime() - 90 * 24 * 60 * 60 * 1000);
  const fmt   = d => d.toISOString().slice(0,19);

  // Paginate through all events
  const allEvents = [];
  let page = 1;
  while (true) {
    document.getElementById('loading-detail').textContent = `Page ${page} · ${allEvents.length} events loaded…`;
    const resp = await fetch(
      `${PROXY}/api/v0/video/safety/eventsWithMetadata?from=${fmt(start)}&to=${fmt(end)}&limit=1000&page=${page}&includeSubgroups=true`,
      { headers: { 'Authorization': 'Bearer ' + token } }
    );
    const data = await resp.json();
    if (!Array.isArray(data) || data.length === 0) break;
    // Filter client-side to exact window since Lytx may use downloadedDate not recordDateUTC
    const filtered = data.filter(e => {
      const d = new Date(e.recordDateUTC);
      return d >= start && d <= end;
    });
    allEvents.push(...filtered);
    if (data.length < 1000) break;
    page++;
  }

  document.getElementById('loading-detail').textContent = `Processing ${allEvents.length} events…`;

  // Build per-group driver map (combine Transport groups)
  const driverMap = {}; // group -> driverName -> { coachable, total, groupEventCount }
  GROUP_ORDER.forEach(g => driverMap[g] = {});

  // Track which group has more events for each driver (for cross-group dedup)
  const driverGroupCount = {}; // driverName -> { group -> count }

  for (const e of allEvents) {
    const gid = e.groupId;
    if (!GROUPS[gid]) continue;
    if (!isValidDriver(e)) continue;
    const group = GROUPS[gid];
    const name = (e.driverFirstName + ' ' + e.driverLastName).trim();

    if (!driverMap[group]) driverMap[group] = {};
    if (!driverMap[group][name]) driverMap[group][name] = { coachable: 0, total: 0, scoreSum: 0 };
    driverMap[group][name].total++;
    if (e.isCoachable) { driverMap[group][name].coachable++; driverMap[group][name].scoreSum += (e.score || 0); }

    // Track cross-group presence
    if (!driverGroupCount[name]) driverGroupCount[name] = {};
    if (!driverGroupCount[name][group]) driverGroupCount[name][group] = 0;
    driverGroupCount[name][group]++;
  }

  // For drivers appearing in multiple groups, keep only the group with highest event count
  const driverPrimaryGroup = {};
  for (const [name, groups] of Object.entries(driverGroupCount)) {
    const primary = Object.entries(groups).sort((a,b) => b[1]-a[1])[0][0];
    driverPrimaryGroup[name] = primary;
    lytxDriverGroup[nameKey(name.split(' ')[0], name.split(' ').slice(-1)[0])] = primary;
  }
  if (dotData) renderDot(); // re-tag divisions once Lytx groups are known

  // Build final leaderboards, excluding drivers not in primary group
  const leaderboards = {};
  for (const group of GROUP_ORDER) {
    const drivers = driverMap[group] || {};
    const scored = [];
    for (const [name, stats] of Object.entries(drivers)) {
      if (driverPrimaryGroup[name] !== group) continue; // skip if primary group is elsewhere
      scored.push({ name, ...stats, displayScore: stats.scoreSum });
    }
    // Sort: fewest coachable first, then fewest total events as tiebreaker, then alpha
    scored.sort((a,b) => a.scoreSum - b.scoreSum || a.coachable - b.coachable || a.name.localeCompare(b.name));
    leaderboards[group] = scored.slice(0, 10);
  }

  renderLeaderboard(leaderboards, allEvents.length, start, end);
}

    });

/* =========================================================
   Unit Loads (Terminal EOD BOL reports → Apps Script → Worker → here)
   ========================================================= */
let bolData = null;
let bolDays = 30;
let bolTerminal = '';
let bolUnitSort = { key: 'loads', dir: -1 };
let bolDriverSort = { key: 'loads', dir: -1 };
let bolOpenUnit = null, bolOpenDriver = null;
const gal = n => Math.round(n).toLocaleString('en-US');
const unitNum = u => { const m = /(\d+)/.exec(u || ''); return m ? +m[1] : 1e9; };

async function loadBol() {
  try {
    const r = await fetch(CAB_API + '/bol');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    bolData = await r.json();
    const upd = new Date(bolData.updatedAt);
    headerText.bol.updated = 'BOL synced ' + upd.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + upd.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    if (!loadBol.wired) wireBolControls();
    renderBol();
    if (currentView === 'bol') setView('bol');
  } catch (e) {
    headerText.bol = { badge: 'Unavailable', updated: 'BOL feed error: ' + e.message };
    document.getElementById('bol-units').innerHTML = `<tr><td class="empty">Could not load BOL data (${esc(e.message)}).</td></tr>`;
    if (currentView === 'bol') applyHeader();
  }
}

function wireBolControls() {
  loadBol.wired = true;
  document.querySelectorAll('#bol-range .range-btn').forEach(b => b.addEventListener('click', () => {
    bolDays = +b.dataset.days; bolOpenUnit = bolOpenDriver = null;
    document.querySelectorAll('#bol-range .range-btn').forEach(x => x.classList.toggle('active', x === b));
    renderBol();
  }));
  const terms = [...new Set(bolData.loads.map(l => l.terminal).filter(Boolean))].sort();
  const sel = document.getElementById('bol-terminal');
  if (terms.length > 1) {
    sel.innerHTML = '<option value="">All terminals</option>' + terms.map(t => `<option>${esc(t)}</option>`).join('');
    sel.style.display = '';
    sel.addEventListener('change', () => { bolTerminal = sel.value; renderBol(); });
  }
  document.getElementById('bol-search').addEventListener('input', () => renderBolTables());
}

function bolInRange() {
  const c = new Date(); c.setDate(c.getDate() - bolDays);
  const cut = c.toISOString().slice(0, 10);
  return (bolData?.loads || []).filter(l => l.date >= cut && (!bolTerminal || l.terminal === bolTerminal));
}

let bolUnits = [], bolDrivers = [];

function renderBol() {
  if (!bolData) return;
  const L = bolInRange();
  const units = new Set(L.map(l => l.unit)), drivers = new Set(L.map(l => l.driverId || l.driver));
  const days = new Set(L.map(l => l.date));
  const total = L.reduce((s, l) => s + l.total, 0);
  const last = L.map(l => l.date).sort().at(-1);
  headerText.bol.badge = { 7: 'Last 7 days', 30: 'Last 30 days', 90: 'Last 90 days', 365: 'Last 12 months' }[bolDays];
  if (currentView === 'bol') applyHeader();

  document.getElementById('bol-kpis').innerHTML = [
    ['Loads', L.length, days.size ? (L.length / days.size).toFixed(1) + ' per active day' : '', '#fff'],
    ['Gallons', gal(total), L.length ? gal(total / L.length) + ' avg per load' : '', '#fff'],
    ['Units Loaded', units.size, 'distinct trucks', 'var(--orange-light)'],
    ['Drivers', drivers.size, 'distinct drivers', '#60a5fa'],
    ['Latest Report', last ? fmtDate(last) : '—', last ? L.filter(l => l.date === last).length + ' loads that day' : '', '#fff'],
  ].map(([l, v, s, c]) => `<div class="kpi"><div class="kpi-label">${l}</div><div class="kpi-val" style="color:${c};${String(v).length > 8 ? 'font-size:22px;' : ''}">${v}</div><div class="kpi-sub">${s}</div></div>`).join('');

  // Aggregate by unit and by driver
  const U = {}, D = {};
  for (const l of L) {
    const u = U[l.unit] ||= { unit: l.unit, n: unitNum(l.unit), loads: 0, gal: 0, days: new Set(), drivers: {}, last: '', list: [] };
    u.loads++; u.gal += l.total; u.days.add(l.date); u.list.push(l);
    const dn = l.driver || l.driverId;
    u.drivers[dn] = (u.drivers[dn] || 0) + 1;
    if (l.date + l.time > u.last) u.last = l.date + ' ' + l.time;

    const dk = l.driverId || l.driver;
    const d = D[dk] ||= { key: dk, driver: l.driver, loads: 0, gal: 0, days: new Set(), units: {}, last: '', list: [] };
    d.loads++; d.gal += l.total; d.days.add(l.date); d.list.push(l);
    d.units[l.unit] = (d.units[l.unit] || 0) + 1;
    if (l.date + l.time > d.last) d.last = l.date + ' ' + l.time;
  }
  bolUnits = Object.values(U).map(u => {
    const top = Object.entries(u.drivers).sort((a, b) => b[1] - a[1])[0];
    return { ...u, dayCount: u.days.size, driverCount: Object.keys(u.drivers).length, top: top ? top[0] : '', topShare: top ? top[1] / u.loads : 0 };
  });
  bolDrivers = Object.values(D).map(d => ({ ...d, dayCount: d.days.size, unitCount: Object.keys(d.units).length }));
  renderBolTables();

  // Latest day
  const latest = L.filter(l => l.date === last).sort((a, b) => a.time.localeCompare(b.time));
  document.getElementById('bol-latest-meta').textContent = last ? fmtDate(last) : '';
  document.getElementById('bol-latest').innerHTML = latest.length ? latest.map(l =>
    `<div class="recent"><div class="recent-name">${esc(l.unit)} · ${esc(l.driver)}</div>
     <div class="recent-meta">${esc(l.time)} · ${gal(l.total)} gal · BOL ${esc(l.bol)}${bolTerminal ? '' : ' · ' + esc(l.terminal)}</div></div>`).join('')
    : '<div class="empty">No loads in this period</div>';
}

function sortRows(rows, s) {
  return rows.sort((a, b) => {
    const x = a[s.key], y = b[s.key];
    const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y));
    return c * s.dir;
  });
}
function headRow(cols, s) {
  return '<tr>' + cols.map(c => `<th class="${c.num ? 'num' : ''} ${c.key === s.key ? 'sorted' : ''}" data-k="${c.key}">${c.label}${c.key === s.key ? (s.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('') + '</tr>';
}
function bindSort(table, getS, setS, textKeys) {
  table.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.k, s = getS();
    setS(s.key === k ? { key: k, dir: -s.dir } : { key: k, dir: textKeys.includes(k) ? 1 : -1 });
    renderBolTables();
  }));
}

  ut.innerHTML = headRow(UNIT_COLS, bolUnitSort) + (urows.map(u => {
    let h = `<tr class="drow" data-key="${esc(u.unit)}">
      <td style="font-weight:600">${esc(u.unit)}</td>
      <td class="num mono">${u.loads}</td><td class="num mono">${u.dayCount}</td><td class="num mono">${gal(u.gal)}</td>
      <td class="num mono" style="color:${u.driverCount > 2 ? '#fbbf24' : 'inherit'}">${u.driverCount}</td>
      <td>${esc(u.top)} <span style="color:var(--text3);font-size:11px;font-family:'DM Mono',monospace">${Math.round(u.topShare * 100)}%</span></td>
      <td class="num mono">${fmtDate(u.last.slice(0, 10))}</td></tr>`;
    if (bolOpenUnit === u.unit) {
      const byDriver = Object.entries(u.drivers).sort((a, b) => b[1] - a[1])
        .map(([d, n]) => `<span class="pill" style="background:var(--surface2);color:var(--text);margin:0 6px 6px 0;display:inline-block">${esc(d)} · ${n}</span>`).join('');
      const loads = [...u.list].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).slice(0, 25).map(l =>
        `<div class="insp"><div class="insp-top">${fmtDate(l.date)} ${esc(l.time)} · ${esc(l.driver)} · ${gal(l.total)} gal · BOL ${esc(l.bol)} · ${esc(l.terminal)}</div></div>`).join('');
      h += `<tr class="detail-row"><td colspan="${UNIT_COLS.length}"><div style="margin-bottom:8px">${byDriver}</div>${loads}${u.list.length > 25 ? `<div class="vio">+ ${u.list.length - 25} more</div>` : ''}</td></tr>`;
    }
    return h;
  }).join('') || `<tr><td colspan="${UNIT_COLS.length}" class="empty">No units match</td></tr>`);
  bindSort(ut, () => bolUnitSort, s => bolUnitSort = s, ['n', 'top']);
  ut.querySelectorAll('tr.drow').forEach(tr => tr.addEventListener('click', () => {
    bolOpenUnit = bolOpenUnit === tr.dataset.key ? null : tr.dataset.key; renderBolTables();
  }));

  // Drivers
  const drows = sortRows(bolDrivers.filter(d => match(d.driver, ...Object.keys(d.units))), bolDriverSort);
  document.getElementById('bol-driver-meta').textContent = `${drows.length} driver${drows.length !== 1 ? 's' : ''}`;
  const dt = document.getElementById('bol-drivers');
  dt.innerHTML = headRow(DRIVER_COLS, bolDriverSort) + (drows.map(d => {
    let h = `<tr class="drow" data-key="${esc(d.key)}"><td style="font-weight:500">${esc(d.driver)}</td>
      <td class="num mono">${d.loads}</td><td class="num mono">${d.dayCount}</td><td class="num mono">${d.unitCount}</td></tr>`;
    if (bolOpenDriver === d.key) {
      const byDay = {};
      d.list.forEach(l => (byDay[l.date] ||= []).push(l));
      const days = Object.keys(byDay).sort().reverse().slice(0, 14).map(day => {
        const ls = byDay[day].sort((a, b) => a.time.localeCompare(b.time));
        const units = [...new Set(ls.map(l => l.unit))].join(', ');
        return `<div class="insp"><div class="insp-top">${fmtDate(day)} · ${ls.length} load${ls.length > 1 ? 's' : ''} · ${esc(units)} · ${gal(ls.reduce((s, l) => s + l.total, 0))} gal</div></div>`;
      }).join('');
      h += `<tr class="detail-row"><td colspan="${DRIVER_COLS.length}">${days}</td></tr>`;
    }
    return h;
  }).join('') || `<tr><td colspan="${DRIVER_COLS.length}" class="empty">No drivers match</td></tr>`);
  bindSort(dt, () => bolDriverSort, s => bolDriverSort = s, ['driver']);
  dt.querySelectorAll('tr.drow').forEach(tr => tr.addEventListener('click', () => {
    bolOpenDriver = bolOpenDriver === tr.dataset.key ? null : tr.dataset.key; renderBolTables();
  }));
}
</script>
</body>
</html>
